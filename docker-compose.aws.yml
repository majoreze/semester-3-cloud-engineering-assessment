name: muchtodo-aws

services:
  backend:
    image: ${IMAGE:?IMAGE must be supplied by the deployment environment}
    container_name: muchtodo-api
    env_file:
      - .env
    environment:
      PORT: "8080"
      JWT_EXPIRATION_HOURS: "72"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
